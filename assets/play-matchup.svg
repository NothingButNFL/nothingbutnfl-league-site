<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".2">
  <!-- One play drawn across the panel: the away defense (left) lined up against the home offense (right).
       The line of scrimmage runs down the middle, on the gold divider. The offense attacks to the left. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fff" stroke="none"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M5 0v10" stroke="#fff" stroke-width="3"/></marker>
  </defs>
  <path d="M600 6V414" stroke-dasharray="2 12" stroke-width="3"/>

  <!-- OFFENSE (right): line, center, tight end, QB, RB, receivers -->
  <g>
    <circle cx="632" cy="150" r="12"/><circle cx="632" cy="180" r="12"/><rect x="620" y="198" width="24" height="24"/><circle cx="632" cy="240" r="12"/><circle cx="632" cy="270" r="12"/>
    <circle cx="640" cy="302" r="12"/>
    <circle cx="690" cy="210" r="12"/><circle cx="745" cy="210" r="12"/>
    <circle cx="632" cy="40" r="12"/><circle cx="650" cy="100" r="12"/><circle cx="632" cy="384" r="12"/>
  </g>
  <g marker-end="url(#b)"><path d="M618 150h-16"/><path d="M618 180h-16"/><path d="M618 210h-16"/><path d="M618 240h-16"/><path d="M618 270h-16"/></g>
  <g marker-end="url(#a)">
    <path d="M618 40H90"/>
    <path d="M636 100h-80l-120 70"/>
    <path d="M626 302h-110v80h-90"/>
    <path d="M618 384H440l-120-90"/>
    <path d="M745 222c20 70-20 120-120 150" stroke-dasharray="10 9"/>
    <path d="M702 210h30" stroke-dasharray="6 7"/>
  </g>

  <!-- DEFENSE (left): line, linebackers, corners, safeties as X's -->
  <g stroke-width="4">
    <path d="M560 157l16 16m0-16-16 16"/><path d="M560 202l16 16m0-16-16 16"/><path d="M560 247l16 16m0-16-16 16"/><path d="M560 284l16 16m0-16-16 16"/>
    <path d="M490 122l16 16m0-16-16 16"/><path d="M480 202l16 16m0-16-16 16"/><path d="M490 282l16 16m0-16-16 16"/>
    <path d="M562 32l16 16m0-16-16 16"/><path d="M562 376l16 16m0-16-16 16"/>
    <path d="M300 92l16 16m0-16-16 16"/><path d="M300 312l16 16m0-16-16 16"/>
  </g>
  <g marker-end="url(#a)">
    <path d="M578 165l50 0" transform="translate(0 -8)"/><path d="M578 210h40"/><path d="M578 255h40"/><path d="M578 292l40 10"/>
    <path d="M506 130c40 0 70 20 92 40"/>
  </g>
  <g marker-end="url(#a)" stroke-dasharray="10 9">
    <path d="M488 210l-60 0"/><path d="M490 290l-70 20"/>
    <path d="M562 40c-60 0-120 10-170 30"/><path d="M562 384c-60 0-120-10-170-30"/>
    <path d="M300 100l-60-30"/><path d="M300 320l-60 30"/>
  </g>
  <g stroke-width="2.5" stroke-dasharray="3 9">
    <ellipse cx="400" cy="210" rx="44" ry="80"/>
    <ellipse cx="200" cy="90" rx="70" ry="80"/><ellipse cx="200" cy="330" rx="70" ry="80"/>
  </g>
</svg>
