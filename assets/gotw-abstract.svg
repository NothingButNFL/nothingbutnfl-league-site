<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <!-- Modern abstract vector backdrop for the Game of the Week: angular planes, rings, dot grids and speed lines,
       in translucent white and black so each team's color shows through. Mirrored around the center divider. -->
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff"/></pattern>
    <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="1" x2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <g id="half">
      <!-- big angular planes -->
      <polygon points="0,0 430,0 250,420 0,420" fill="#000" fill-opacity=".18"/>
      <polygon points="0,0 230,0 60,420 0,420" fill="#000" fill-opacity=".14"/>
      <polygon points="330,0 470,0 290,420 150,420" fill="url(#fadeL)"/>
      <polygon points="500,0 560,0 380,420 320,420" fill="#fff" fill-opacity=".05"/>
      <!-- dot grid -->
      <rect x="28" y="24" width="150" height="110" fill="url(#dots)" opacity=".16"/>
      <rect x="380" y="300" width="120" height="90" fill="url(#dots)" opacity=".1"/>
      <!-- rings -->
      <g fill="none" stroke="#fff">
        <circle cx="110" cy="360" r="70" stroke-opacity=".12" stroke-width="2"/>
        <circle cx="110" cy="360" r="110" stroke-opacity=".08" stroke-width="2"/>
        <circle cx="110" cy="360" r="150" stroke-opacity=".05" stroke-width="2"/>
      </g>
      <!-- speed lines -->
      <g stroke="#fff" stroke-linecap="round">
        <path d="M200 60h140" stroke-opacity=".18" stroke-width="3"/>
        <path d="M240 78h90" stroke-opacity=".12" stroke-width="3"/>
        <path d="M30 220h110" stroke-opacity=".12" stroke-width="2"/>
        <path d="M60 236h60" stroke-opacity=".09" stroke-width="2"/>
      </g>
      <!-- small accents -->
      <path d="M520 360l20-20 20 20-20 20z" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
      <path d="M470 40h40M490 20v40" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    </g>
  </defs>
  <use href="#half"/>
  <use href="#half" transform="matrix(-1 0 0 1 1200 0)"/>
  <!-- center: concentric rings and glow behind the score -->
  <rect width="1200" height="420" fill="url(#glow)"/>
  <g fill="none" stroke="#fff">
    <circle cx="600" cy="225" r="92" stroke-opacity=".14" stroke-width="2"/>
    <circle cx="600" cy="225" r="140" stroke-opacity=".08" stroke-width="2" stroke-dasharray="4 10"/>
    <circle cx="600" cy="225" r="200" stroke-opacity=".05" stroke-width="2"/>
  </g>
</svg>
